name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  test:
    name: host-tests
    # Pinned on purpose: the suite runs real `socat`, and its behaviour differs
    # between versions (1.8.0.0 needed an explicit `pf=ip4` on UDP-LISTEN).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: pkg

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox socat nodejs procps

      - name: Run the test suite (view, generator, zones, layout simulator)
        run: |
          cd pkg
          echo "shell:  $(readlink -f /bin/sh)"
          echo "socat:  $(socat -V 2>&1 | sed -n 2p)"
          echo "awk:    $(awk -W version 2>&1 | head -1)"
          echo "node:   $(node --version)"
          # root on purpose: on a router the engine *is* root, and the suite
          # deliberately covers `,user=nobody` and a unix socket it chowns —
          # both need the privilege, and without it the run reports dead
          # listeners that are fine in production.
          sudo -E env "PATH=$PATH" sh tests/run.sh

  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # OpenWrt 24.10 (opkg, .ipk) — JS LuCI
          - name: 24.10-x86_64
            base: releases
            ver: "24.10.4"
            target: x86/64
            ext: ipk
            publish: true
          - name: 24.10-aarch64
            base: releases
            ver: "24.10.4"
            target: armsr/armv8
            ext: ipk
          - name: 24.10-mips
            base: releases
            ver: "24.10.4"
            target: ath79/generic
            ext: ipk
          # OpenWrt 25.12 (apk, .apk) — ucode-only LuCI (25.x line).
          # Built against the stable release, not snapshot: the dependency
          # versions then match what people actually run.
          - name: 25.12.2-x86_64
            base: releases
            ver: "25.12.2"
            target: x86/64
            ext: apk
            publish: true
          # Snapshot is still built (catches next-release breakage early) but
          # not published: it would produce the same file names as the line above.
          - name: snapshot-x86_64
            base: snapshots
            ver: SNAPSHOT
            target: x86/64
            ext: apk

    steps:
      - uses: actions/checkout@v4
        with:
          path: pkg

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file wget rsync unzip zstd \
            libncurses-dev libssl-dev python3

      - name: Download and unpack SDK
        env:
          BASE: ${{ matrix.base }}
          VER: ${{ matrix.ver }}
          TARGET: ${{ matrix.target }}
        run: |
          set -e
          if [ "$BASE" = "snapshots" ]; then
            DIR="https://downloads.openwrt.org/snapshots/targets/$TARGET/"
          else
            DIR="https://downloads.openwrt.org/releases/$VER/targets/$TARGET/"
          fi
          FILE=$(wget -qO- "$DIR" | grep -oE 'openwrt-sdk-[^"]+Linux-x86_64\.tar\.zst' | head -n1)
          echo "Using SDK: $DIR$FILE"
          wget -qO sdk.tar.zst "$DIR$FILE"
          mkdir -p sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Pin build timestamps
        run: |
          # Reproducible package metadata: without this the SDK stamps the ipk/apk
          # with whatever the build machine clock says.
          echo "SOURCE_DATE_EPOCH=$(git -C pkg log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -e
          cd sdk
          mkdir -p package/luci-app-socat-reforged
          cp -a ../pkg/. package/luci-app-socat-reforged/
          rm -rf package/luci-app-socat-reforged/.git package/luci-app-socat-reforged/.github
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          make package/luci-app-socat-reforged/compile V=s -j"$(nproc)"

      - name: Collect packages
        run: |
          set -e
          mkdir -p out
          find sdk/bin/packages \( -name "luci-app-socat-reforged*.${{ matrix.ext }}" -o -name "luci-i18n-socat-reforged*.${{ matrix.ext }}" \) -exec cp -v {} out/ \;
          test -n "$(ls -A out)" || { echo "no package produced; dumping tree:"; find sdk/bin/packages -maxdepth 2 -type d; find sdk/bin/packages -type f | head; exit 1; }
          # luci.mk stamps translation packages with the feed's build time, so a
          # re-run of this workflow produced a second, differently named copy of
          # the same .ipk in the release.  Pin every language pack to the app
          # version, which also makes --clobber replace the previous upload.
          VER="$(sed -n 's/^PKG_VERSION:=//p' pkg/Makefile)-r$(sed -n 's/^PKG_RELEASE:=//p' pkg/Makefile)"
          # The locale name itself may contain a dash (zh-cn), and the version
          # separator differs per format (_ for ipk, - for apk), so match the
          # language against the catalogues in po/ instead of stripping a suffix.
          LANGS=""
          for d in pkg/po/*/; do
            [ -d "$d" ] || continue
            l=${d%/}; l=${l##*/}
            [ "$l" = templates ] && continue
            [ "$l" = zh_Hans ] && l=zh-cn
            LANGS="$LANGS $l"
          done
          for f in out/luci-i18n-socat-reforged-*; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            rest=${base#luci-i18n-socat-reforged-}
            lang=""
            for l in $LANGS; do
              case "$rest" in "$l"_*|"$l"-*) lang=$l; break ;; esac
            done
            [ -n "$lang" ] || { echo "cannot map language pack $base to a catalogue"; exit 1; }
            case "$base" in
              *.ipk) mv "$f" "out/luci-i18n-socat-reforged-${lang}_${VER}_all.ipk" ;;
              *.apk) mv "$f" "out/luci-i18n-socat-reforged-${lang}-${VER}.apk" ;;
            esac
          done
          ls -la out/
          # The updater refuses to install anything that is not listed here.
          (cd out && sha256sum $(ls -1 | grep -v '^sha256sums') > "sha256sums.${{ matrix.ext }}")
          cat "out/sha256sums.${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

      - name: Attach packages to the release
        if: github.event_name == 'release' && matrix.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" out/* --clobber --repo "${{ github.repository }}"
